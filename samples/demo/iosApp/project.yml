name: DemoApp
options:
  bundleIdPrefix: com.jantursky.casement
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework is built for arm64 simulators only (no iosX64 target).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.jantursky.casement.demo
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework DemoKit"
targets:
  DemoApp:
    type: application
    platform: iOS
    sources:
      - DemoApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DemoApp/Info.plist
      properties:
        CFBundleDisplayName: Casement demo
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../.."
          ./gradlew :samples:demo:shared:embedAndSignAppleFrameworkForXcode
  DemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DemoAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jantursky.casement.demo.uitests
    dependencies:
      - target: DemoApp
schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
    test:
      targets:
        - DemoAppUITests
