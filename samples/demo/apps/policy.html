<!doctype html>
<html><head><meta charset="utf-8"><title>Link policy</title><style>:root { color-scheme: light dark; }
body { margin: 0; padding: 12px; font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px;
  background: var(--color-background-primary, transparent); color: var(--color-text-primary, #1c1b1f); }
h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
p { margin: 0 0 8px; font-size: 12px; color: var(--color-text-secondary, #5f5b66); }
button { margin: 6px 8px 0 0; padding: 8px 14px; font: inherit; cursor: pointer;
  border: 1px solid var(--color-border-primary, #c9c5cf); border-radius: var(--border-radius-md, 8px);
  background: var(--color-background-secondary, transparent); color: inherit; }
button.primary { background: var(--color-text-primary, #1c1b1f); color: var(--color-background-primary, #fff); }
#out { margin-top: 10px; font-size: 12px; color: var(--color-text-secondary, #5f5b66); white-space: pre-wrap; }
</style></head>
<body>
<h1>Link policy</h1>
<p>This app asks the host to open two links. The host allows only https.</p>
<button class="primary" id="https">Open https link</button><button id="http">Open http link</button>
<div id="out"></div>
<script>
var nextId = 1, waiting = {}, listeners = {};
window.addEventListener('message', function (e) {
  var m = e.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.method && listeners[m.method]) listeners[m.method](m.params || {});
  else if (m.id !== undefined && waiting[m.id]) { waiting[m.id](m); delete waiting[m.id]; }
});
function rpc(method, params) {
  return new Promise(function (resolve) {
    var id = nextId++;
    waiting[id] = resolve;
    window.parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params }, '*');
  });
}
function notify(method, params) {
  window.parent.postMessage({ jsonrpc: '2.0', method: method, params: params }, '*');
}
function reportSize() {
  notify('ui/notifications/size-changed', { height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
}
function ask(url) {
  rpc('ui/open-link', { url: url }).then(function (m) {
    // A refused link comes back as a result with isError set, not as a JSON-RPC error.
    var refused = m.error || (m.result && m.result.isError);
    document.getElementById('out').textContent = refused ? 'Refused by the host' : 'The host opened ' + url;
    reportSize();
  });
}
rpc('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: document.title, version: '1.0.0' }, appCapabilities: {} })
  .then(function () {
    notify('ui/notifications/initialized');
    document.getElementById('https').onclick = function () { ask('https://example.com/'); };
    document.getElementById('http').onclick = function () { ask('http://example.com/'); };
    reportSize();
  });
</script></body></html>
