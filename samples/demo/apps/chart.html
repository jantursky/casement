<!doctype html>
<html><head><meta charset="utf-8"><title>Sales chart</title><style>:root { color-scheme: light dark; }
body { margin: 0; padding: 12px; font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px;
  background: var(--color-background-primary, transparent); color: var(--color-text-primary, #1c1b1f); }
h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
label { display: block; font-size: 12px; margin: 8px 0 3px; color: var(--color-text-secondary, #5f5b66); }
input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; color: inherit;
  background: var(--color-background-secondary, transparent); border: 1px solid var(--color-border-primary, #c9c5cf);
  border-radius: var(--border-radius-md, 8px); }
button { margin: 10px 8px 0 0; padding: 8px 14px; font: inherit; cursor: pointer;
  border: 1px solid var(--color-border-primary, #c9c5cf); border-radius: var(--border-radius-md, 8px);
  background: var(--color-background-secondary, transparent); color: inherit; }
button.primary { background: var(--color-text-primary, #1c1b1f); color: var(--color-background-primary, #fff); }
#out { margin-top: 10px; font-size: 12px; color: var(--color-text-secondary, #5f5b66); white-space: pre-wrap; }

svg { width: 100%; height: 160px; display: block; }
.bar { fill: var(--color-text-primary, #1c1b1f); opacity: .85; }
text { font-size: 10px; fill: var(--color-text-secondary, #5f5b66); }
</style></head>
<body>
<h1>Sales by month</h1>
<svg id="chart" viewBox="0 0 240 160" preserveAspectRatio="none" role="img" aria-label="Bar chart"></svg>
<button id="refresh">Refresh data</button>
<div id="out"></div>
<script>
var nextId = 1, waiting = {}, listeners = {};
window.addEventListener('message', function (e) {
  var m = e.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.method && listeners[m.method]) listeners[m.method](m.params || {});
  else if (m.id !== undefined && waiting[m.id]) { waiting[m.id](m); delete waiting[m.id]; }
});
function rpc(method, params) {
  return new Promise(function (resolve) {
    var id = nextId++;
    waiting[id] = resolve;
    window.parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params }, '*');
  });
}
function notify(method, params) {
  window.parent.postMessage({ jsonrpc: '2.0', method: method, params: params }, '*');
}
function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.setAttribute('data-theme', ctx.theme);
  var vars = ctx.styles && ctx.styles.variables;
  if (vars) Object.keys(vars).forEach(function (k) { document.documentElement.style.setProperty(k, vars[k]); });
}
function reportSize() {
  notify('ui/notifications/size-changed', { height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
}
function start(onReady) {
  listeners['ui/notifications/host-context-changed'] = applyContext;
  rpc('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: document.title, version: '1.0.0' }, appCapabilities: {} })
    .then(function (m) {
      applyContext(m.result && m.result.hostContext);
      notify('ui/notifications/initialized');
      onReady();
      reportSize();
    });
}

function draw(series) {
  var svg = document.getElementById('chart'), max = Math.max.apply(null, series.map(function (p) { return p.value; }));
  svg.innerHTML = series.map(function (p, i) {
    var h = Math.round(p.value / max * 130), x = i * 40 + 6;
    return '<rect class="bar" x="' + x + '" y="' + (140 - h) + '" width="28" height="' + h + '" rx="4"></rect>' +
      '<text x="' + (x + 14) + '" y="154" text-anchor="middle">' + p.label + '</text>';
  }).join('');
}
listeners['ui/notifications/tool-result'] = function (r) {
  var s = r.structuredContent; if (s && s.series) { draw(s.series); reportSize(); }
};
start(function () {
  document.getElementById('refresh').onclick = function () {
    rpc('tools/call', { name: 'refresh-data', arguments: {} }).then(function (m) {
      var s = m.result && m.result.structuredContent;
      if (s && s.series) draw(s.series);
      document.getElementById('out').textContent = m.error ? 'Error: ' + m.error.message : 'Updated';
    });
  };
});
</script></body></html>
